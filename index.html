<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .update {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        .date {
            color: gray;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>My Project Updates</h1>
    <p>Sharing my progress and ideas</p>
</header>

<div class="container">

    <!-- Example Update -->
    <div class="update">
        <h2>Project Title</h2>
        <p class="date">May 16, 2026</p>
        <p>This is where you write about your project update. You can describe what you built, fixed, or learned.</p>
    </div>

    <!-- Add more updates below -->
    <div class="update">
        <h2>Another Update</h2>
        <p class="date">May 15, 2026</p>
        <p>Write another update here. Just copy this block and edit it.</p>
    </div>

</div>

</body>
</html>
